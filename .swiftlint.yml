# ==============================================================================
# Cloudns - SwiftLint 现代化架构规范配置
# 适配: 现代 SwiftUI + Swift Concurrency + Cloudflare API 客户端架构
# 原则: 安全规则严苛拦截（防崩溃/防泄漏），UI与声明式语法科学放宽
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 扫描与排除路径
# ------------------------------------------------------------------------------
included:
  - Cloudns                # App 主项目源码
  - CloudnsWidgets         # 小组件扩展源码

excluded:
  - Pods
  - .build
  - DerivedData
  - CloudnsTests
  - CloudnsUITests
  - "**/Generated/*"

# ------------------------------------------------------------------------------
# 2. 禁用的陈旧/冲突规则（适配 SwiftUI 声明式语法与后端 API 特性）
# ------------------------------------------------------------------------------
disabled_rules:
  - trailing_whitespace                     # 忽略行尾空格，避免无意义的提交冲突
  - todo                                    # 允许 TODO / FIXME 注释（由敏捷看板管理）
  - nesting                                 # 允许在 SwiftUI 视图内部就近声明专有子枚举/模型
  - multiple_closures_with_trailing_closure # 允许 SwiftUI 官方标准多尾随闭包（如 Button { } label: { }）
  - large_tuple                             # 允许返回 3 个及以上成员的元组（如多返回值服务方法）
  - function_parameter_count                # 允许复杂 API 初始化与请求方法接收多个参数
  - file_length                             # 允许大型 API Client Facade 单文件集中管理
  - type_body_length                        # 允许大型 API Client Facade 服务类
  - identifier_name                         # 允许 Codable 结构中使用 Cloudflare 蛇形字段名及单字母闭包参数
  - cyclomatic_complexity                   # 放宽复杂网络与协议解析的圈复杂度
  - line_length                             # 放宽单行长度限制以适配 SwiftUI 链式声明修饰器与长 URL

# ------------------------------------------------------------------------------
# 3. 严格选入的安全与性能规则（重点拦截 Bug、崩溃与性能损耗）
# ------------------------------------------------------------------------------
opt_in_rules:
  # 稳定性与防崩溃
  - force_unwrapping                        # 严格检测强制解包 !（根治 80% 线上 Crash）
  - fatal_error_message                     # 确保 fatalError 带有明确原因，便于日志追查
  - redundant_nil_coalescing                # 避免 ?? nil 等冗余无意义操作
  - unneeded_break_in_switch                # 去除 switch case 中多余的 break
  - weak_delegate                           # 确保 delegate 声明为 weak，杜绝强引用循环与内存泄漏
  - overridden_super_call                   # 确保重写父类生命周期方法时不漏掉 super 调用
  - identical_operands                      # 检查 a == a 等手误复制粘贴的无效比较

  # 性能与现代 Swift 惯用法
  - empty_count                             # 强制使用 .isEmpty 代替 .count == 0（O(1) 效率）
  - empty_string                            # 强制使用 .isEmpty 代替 == ""
  - contains_over_first_not_nil             # 优先使用 contains 代替 first != nil（表达力更优）
  - first_where                             # 优先使用 .first(where:) 代替 .filter(...).first（避免生成临时数组，提升查询性能）
  - last_where                              # 优先使用 .last(where:) 代替 .filter(...).last
  - toggle_bool                             # 推荐使用 flag.toggle() 代替 flag = !flag
  - duplicate_imports                       # 避免在同一文件中重复 import 相同模块

# ------------------------------------------------------------------------------
# 4. 阈值参数定制
# ------------------------------------------------------------------------------
function_body_length:
  warning: 120
  error: 250

# ------------------------------------------------------------------------------
# 5. Cloudns 专属业务定制红线规则（通过正则在编译期拦截深层隐患）
# ------------------------------------------------------------------------------
custom_rules:
  # 拦截空字符串本地化键（根治 Xcode 提取空键 "" 以及运行时 strings 报错）
  empty_localized_key:
    name: "Empty Localized String Key"
    regex: '(LocalizedStringKey|ColorPicker|NSLocalizedString|Text)\s*\(\s*""\s*[,)]'
    message: "避免传递空字符串字面量作为本地化键，这会导致 Xcode 自动提取空键并产生运行时缺失警告；若需要无文本占位，请使用 Text(verbatim: \"\") 或 Spacer()。"
    severity: error
